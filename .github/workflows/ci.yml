name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: full_stack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/full_stack
      PORT: "3000"
      FRONTEND_ORIGIN: http://localhost:5173
      JWT_SECRET: ci-jwt-secret-key
      JWT_EXPIRES_IN: 15m
      JWT_EXPIRES_SECONDS: "900"
      JWT_REFRESH_EXPIRES_SECONDS: "604800"
      REDIS_URL: redis://127.0.0.1:6379
      VITE_API_BASE_URL: /api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm build:shared
      - run: pnpm lint
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm test:unit
      - run: pnpm test:api
      - run: pnpm test:e2e
      - run: pnpm --filter @full-stack/backend build
      - run: pnpm --filter @full-stack/frontend build
