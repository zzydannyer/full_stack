version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: "/apps/backend-axum"
    schedule:
      interval: weekly

  - package-ecosystem: maven
    directory: "/apps/backend-spring"
    schedule:
      interval: weekly
