[package]
name = "backend-axum"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "chrono"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.7.0", features = ["cors"] }
